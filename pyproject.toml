[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariant-guardian-action"
version = "0.1.0"
description = "Repository-owned architecture invariant checks for pull requests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.0,<3",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "tree-sitter==0.26.0",
  "tree-sitter-java==0.23.5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
invariant-guardian = "invariant_guardian.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
