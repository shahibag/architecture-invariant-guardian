name: Invariant Guardian
description: Assess Java/Spring pull requests against repository-owned architectural invariants.
author: Invariant Guardian contributors

inputs:
  github-token:
    description: Token with contents:read and pull-requests:write permissions.
    required: true
  llm-api-key:
    description: Optional API key for an OpenAI-compatible evidence judge in trusted repository contexts.
    required: false
  model:
    description: OpenAI-compatible model identifier used by the evidence judge.
    required: false
    default: deepseek-v4-flash
  llm-base-url:
    description: OpenAI-compatible base URL, such as https://api.deepseek.com.
    required: false
    default: https://api.deepseek.com
  invariant-path:
    description: Base-repository directory containing Markdown invariant files.
    required: false
    default: .guardian/invariants

runs:
  using: docker
  image: Dockerfile
  args: [run-action]
