name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 — immutable SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python@v5 — immutable SHA
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' -c constraints.txt
      - run: python -m pytest -o addopts=''
      - run: python -m ruff check src/ tests/
      - run: python -m mypy src/
      - run: python -m pip check
      - name: Docker build smoke test
        run: docker build -t invariant-guardian:ci-test .
      - name: Docker entrypoint smoke
        run: docker run --rm invariant-guardian:ci-test --help
      - name: Docker pip check inside image
        run: >-
          docker run --rm --entrypoint python invariant-guardian:ci-test
          -m pip check
      - name: Docker parser import verification
        run: >-
          docker run --rm --entrypoint python invariant-guardian:ci-test
          -c "from invariant_guardian.rules.java_ast import parse_java_source; print('parser OK')"
      - name: Docker assess with fixture invariants
        run: >-
          docker run --rm
          -v ${{ github.workspace }}/tests/fixtures:/fixtures:ro
          invariant-guardian:ci-test
          assess --invariants /fixtures/invariants --diff /fixtures/clean.diff
          | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['status'] == 'no_confirmed_violations', f'Expected no_confirmed_violations, got {d[\"status\"]}'
          assert len(d['candidates']) == 0, f'Expected 0 candidates, got {len(d[\"candidates\"])}'
          assert len(d['violations']) == 0, f'Expected 0 violations, got {len(d[\"violations\"])}'
          assert d['coverage']['context_truncated'] == False
          assert len(d['coverage']['evaluated_files']) >= 1
          print('PASS: clean.diff → no_confirmed_violations')
          "
      - name: Docker assess domain-leak violation
        run: >-
          docker run --rm
          -v ${{ github.workspace }}/tests/fixtures:/fixtures:ro
          invariant-guardian:ci-test
          assess --invariants /fixtures/invariants --diff /fixtures/domain_leak.diff
          | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['status'] == 'candidates_require_judgment', f'Expected candidates_require_judgment, got {d[\"status\"]}'
          assert len(d['candidates']) >= 1, f'Expected >=1 candidate, got {len(d[\"candidates\"])}'
          assert any(c['invariant_id'] == 'no-domain-leak' for c in d['candidates'])
          assert d['coverage']['context_truncated'] == False
          print('PASS: domain_leak.diff → candidates_require_judgment')
          "
      - name: Docker assess temporary-monitoring violation
        run: >-
          docker run --rm
          -v ${{ github.workspace }}/tests/fixtures:/fixtures:ro
          invariant-guardian:ci-test
          assess --invariants /fixtures/invariants --diff /fixtures/temporary_monitoring.diff
          | python -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['status'] == 'candidates_require_judgment', f'Expected candidates_require_judgment, got {d[\"status\"]}'
          assert len(d['candidates']) >= 1, f'Expected >=1 candidate, got {len(d[\"candidates\"])}'
          assert any(c['invariant_id'] == 'no-temporary-monitoring' for c in d['candidates'])
          assert d['coverage']['context_truncated'] == False
          print('PASS: temporary_monitoring.diff → candidates_require_judgment')
          "
      - name: Run Action-runner integration tests
        run: python -m pytest tests/test_integration.py -o addopts='' -v
