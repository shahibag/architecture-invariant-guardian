name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 — immutable SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python@v5 — immutable SHA
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' -c constraints.txt
      - run: python -m pytest -o addopts=''
      - run: python -m ruff check src/ tests/
      - run: python -m mypy src/
      - run: python -m pip check
      - name: Docker build smoke test
        run: docker build -t invariant-guardian:ci-test .
      - name: Docker entrypoint smoke
        run: docker run --rm invariant-guardian:ci-test --help
      - name: Docker pip check inside image
        run: >-
          docker run --rm --entrypoint python invariant-guardian:ci-test
          -m pip check
      - name: Docker parser import verification
        run: >-
          docker run --rm --entrypoint python invariant-guardian:ci-test
          -c "from invariant_guardian.rules.java_ast import parse_java_source; print('parser OK')"
      - name: Docker assess with fixture invariants
        run: |
          docker run --rm -v ${{ github.workspace }}/tests/fixtures:/fixtures:ro invariant-guardian:ci-test assess --invariants /fixtures/invariants --diff /fixtures/clean.diff > /tmp/guardian-clean.json
          python -c "import json; d=json.load(open('/tmp/guardian-clean.json')); assert d['status'] == 'no_confirmed_violations'; assert not d['candidates']; assert not d['violations']; assert not d['coverage']['context_truncated']; assert d['coverage']['evaluated_files']; print('PASS: clean fixture')"
      - name: Docker assess domain-leak violation
        run: |
          docker run --rm -v ${{ github.workspace }}/tests/fixtures:/fixtures:ro invariant-guardian:ci-test assess --invariants /fixtures/invariants --diff /fixtures/domain_leak.diff > /tmp/guardian-domain.json
          python -c "import json; d=json.load(open('/tmp/guardian-domain.json')); assert d['status'] == 'candidates_require_judgment'; assert any(c['invariant_id'] == 'no-domain-leak' for c in d['candidates']); assert not d['coverage']['context_truncated']; print('PASS: domain-leak fixture')"
      - name: Docker assess temporary-monitoring violation
        run: |
          docker run --rm -v ${{ github.workspace }}/tests/fixtures:/fixtures:ro invariant-guardian:ci-test assess --invariants /fixtures/invariants --diff /fixtures/temporary_monitoring.diff > /tmp/guardian-monitoring.json
          python -c "import json; d=json.load(open('/tmp/guardian-monitoring.json')); assert d['status'] == 'candidates_require_judgment'; assert any(c['invariant_id'] == 'no-temporary-monitoring' for c in d['candidates']); assert not d['coverage']['context_truncated']; print('PASS: temporary-monitoring fixture')"
      - name: Run Action-runner integration tests
        run: python -m pytest tests/test_integration.py -o addopts='' -v
      - name: Docker Action input/output env contract
        env:
          INPUT_GITHUB-TOKEN: ${{ github.token }}
          INPUT_INVARIANT-PATH: tests/fixtures/invariants
          INPUT_MODEL: deepseek-v4-flash
          INPUT_LLM-BASE-URL: https://api.deepseek.com
        run: |
          # Prove the Docker Action metadata contract: hyphenated INPUT_* names
          # reach the image and all declared outputs are written.
          cat > /tmp/fork-event.json <<'EOF'
          {
            "repository": {"full_name": "owner/repo"},
            "number": 1,
            "pull_request": {
              "base": {"sha": "base"},
              "head": {"sha": "head", "repo": {"fork": true}}
            }
          }
          EOF
          OUT=/tmp/guardian-outputs
          : > "$OUT"
          docker run --rm \
            -e GITHUB_EVENT_PATH=/event.json \
            -e GITHUB_OUTPUT=/github-output \
            -e GITHUB_ACTIONS=true \
            -e INPUT_GITHUB-TOKEN \
            -e INPUT_INVARIANT-PATH \
            -e INPUT_MODEL \
            -e INPUT_LLM-BASE-URL \
            -v /tmp/fork-event.json:/event.json:ro \
            -v "$OUT":/github-output \
            invariant-guardian:ci-test run-action
          echo "--- GITHUB_OUTPUT ---"
          cat "$OUT"
          grep -q '^assessment-status=assessment_incomplete$' "$OUT"
          grep -q '^confirmed-count=0$' "$OUT"
          grep -q '^candidate-count=0$' "$OUT"
          grep -q '^coverage-complete=false$' "$OUT"
          # Secrets/tokens must never appear in the output file.
          if grep -F "${{ github.token }}" "$OUT"; then
            echo "token leaked into GITHUB_OUTPUT" >&2
            exit 1
          fi
          echo "PASS: Docker Action INPUT_/GITHUB_OUTPUT contract"

  action-contract:
    # Real uses: ./ path — only meaningful on pull_request events where the
    # Actions runner injects the PR payload and INPUT_* metadata.
    # This job must load supported invariants from the PR base SHA and complete
    # a clean assessment for non-Java PR changes. assessment_incomplete is a
    # failure here (it previously masked Contents API Base64 decode bugs).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # actions/checkout@v4 — immutable SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Invoke local Docker Action via uses
        id: guardian
        uses: ./
        with:
          github-token: ${{ github.token }}
          invariant-path: tests/fixtures/invariants
      - name: Verify complete Action assessment
        run: |
          status='${{ steps.guardian.outputs.assessment-status }}'
          confirmed='${{ steps.guardian.outputs.confirmed-count }}'
          candidates='${{ steps.guardian.outputs.candidate-count }}'
          coverage='${{ steps.guardian.outputs.coverage-complete }}'
          echo "assessment-status=$status"
          echo "confirmed-count=$confirmed"
          echo "candidate-count=$candidates"
          echo "coverage-complete=$coverage"
          # PR #4 changes are non-Java. With both supported invariants loaded
          # from the base SHA, the only acceptable complete result is clean.
          test "$status" = "no_confirmed_violations"
          test "$confirmed" = "0"
          test "$candidates" = "0"
          test "$coverage" = "true"
          echo "PASS: uses: ./ loaded invariants and completed clean assessment"
